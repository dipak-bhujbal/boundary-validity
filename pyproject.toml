[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-validity"
version = "0.0.1"
description = "Measuring the validity gap in propensity evaluations of agentic boundary crossing."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Dipak Bhujbal", email = "dipak.bhujbal23@gmail.com"}]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
boundary-validity = "boundary_validity.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]
harness = ["inspect-ai>=0.3", "anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
